, e.g. the Beckham poster who "always understood", or the aunties at the party.',support:'Point: Dhami presents Jess as… · Evidence: "…" · Explain: the word "…" suggests… · Link: this shows that…',minutes:20},game:{kind:"memory",title:"Memory Match: Chapter One Words",pairs:[["fantasy","an imagined situation you wish for"],["interrupt","to break in while someone is busy"],["glared","looked at someone angrily"],["dowry","goods a bride's family gives at marriage"],["fiancé","the man someone will marry"],["reluctantly","without wanting to"],["hesitated","paused because unsure"],["gleefully","in a delighted way"]]},unlocksCards:["jess","tony"]},{id:2,chapter:"Chapter Two",title:"The Trial",tagline:"A stranger on the touchline. A real club. A real chance.",pages:"pp. 17–26",week:1,setting:"The park · Hounslow Harriers ground",accent:"saffron",themes:["dreams","gender","secrets"],commentator:["Two goals in the park, and somebody is watching from the edge of the pitch...","Short blonde hair, trackie top, shorts. And an invitation that could change everything.","Keep an eye on what Jess says to the coach about her parents. Every word matters."],bookVoice:{text:"At last, this was my chance to do something different with my life.",ref:"Ch. 2, p. 20"},stats:{passion:92,family:60,freedom:35,friendship:55},vocab:[{word:"irritably",meaning:"in an annoyed, impatient way",wordClass:"adverb"},{word:"melodramatic",meaning:"showing feelings in an exaggerated, over-the-top way",wordClass:"adjective"},{word:"gobsmacked",meaning:"(informal) so surprised you cannot speak",wordClass:"adjective"},{word:"hysterically",meaning:"in a wild, uncontrolled way",wordClass:"adverb"},{word:"trial",meaning:"a test to see if a player is good enough for a team",wordClass:"noun"},{word:"eagerly",meaning:"in a keen, excited way",wordClass:"adverb"},{word:"persuade",meaning:"to make someone agree by giving reasons",wordClass:"verb"},{word:"anxiously",meaning:"in a worried, nervous way",wordClass:"adverb"}, ect of each on the reader.",quote:{text:"I wanted to kiss him, and nothing was going to stop me…",ref:"Ch. 8, p. 92"},sprinter:"The ellipsis makes the reader wait. Rewrite the moment WITHOUT any ellipses or short sentences. What is lost?",minutes:15},{id:"l8-while-3",focus:"Theme",title:"Honest with Herself?",prompt:"Jess blames the wine. Is that honest? Why does Jules stay so angry? Write a paragraph using the quotation below.",quote:{text:"But deep down, I kept asking myself — would I have tried to kiss Joe even if I was stone-cold sober?",ref:"Ch. 8, p. 94"},minutes:10}],post:[{id:"l8-post-1",focus:"Creative",title:"Jules's Side of the Story",prompt:"Rewrite the club scene and the journey home from JULES'S point of view, in the first person: what she saw, what she felt, what she thought on the flight home.",minutes:15},{id:"l8-post-2",focus:"Theme",title:"Theme Tracker: Friendship",prompt:'Add evidence to "Friendship": the makeover (Jules and Mel helping) AND the break-up of the friendship. How can one evening contain both?',minutes:6}],sprinter:{id:"l8-sprint",focus:"Theme",title:"⚡ The Pressure to Look a Certain Way",prompt:`Pinky tells Jess to wear make-up (Ch. 5), Mrs Paxton wants Jules to wear "lacy numbers" (Ch. 6), and in Hamburg Jess "didn't even recognise" herself (Ch. 8). Write an analytical paragraph: How does the novel explore the pressure on girls to look a certain way?`,minutes:20},game:{kind:"memory",title:"Memory Match: Chapter Eight Words",pairs:[["makeover","a big change to how someone looks"],["minuscule","extremely small"],["conscious","aware of something"],["unsteadily","in a wobbly way"],["churning","turning over with nerves"],["refused","said no"],["awkwardness","uncomfortable feeling between people"],["regretted","felt sorry about"]]},unlocksCards:[]},{id:9,chapter:"Chapter Nine",title:"Torn in Two",tagline:"Three conversations. Three closed doors.",pages:"pp. 97–107",week:3,setting:"Home · the clubhouse · Jules's bedroom",accent:"sky",the :"What is the score when Jess arrives?",options:["0–0","Harriers 1–0 up","Harriers 1–0 down","Harriers 2–0 down"],answer:2,why:`"We're one-nil down," says Joe.`},{q:"Who does Jess imagine in the defensive wall?",options:["Joe and Jules","Mum, three aunties and Pinky","Taz and the boys","The Beckhams"],answer:1,why:"They are shaking their heads disapprovingly."},{q:"Where are the scholarships to?",options:["Loughborough","Kingston","Santa Clara","Hamburg"],answer:2,why:'Santa Clara, "who had one of the top teams".'},{q:"What does Mrs Paxton make Jess take off?",options:["Her sari","Her football boots","Her shoes with diamante bows","Her jewellery"],answer:2,why:"They were Mrs Paxton's shoes all along!"}]},unlocksCards:["scout"]},{id:13,chapter:"Chapter Thirteen",title:"Into Our Future",tagline:"No more secrets. No more lies. Departures.",pages:"pp. 157–167",week:4,setting:"The living-room · the floodlit pitch · Heathrow",accent:"sky",themes:["family","dreams","identity","secrets","friendship"],commentator:["The final chapter. The wedding is over and the house is quiet.","Tony has a plan. Jess has a decision. Dad has a story to finish.","And then: Heathrow. Departures. Watch who is crying at the very end."],bookVoice:{text:"No more secrets, no more lies.",ref:"Ch. 13, p. 159"},stats:{passion:100,family:90,freedom:100,friendship:95},vocab:[{word:"condition",meaning:"something that must happen before something else is agreed",wordClass:"noun"},{word:"shamefaced",meaning:"looking embarrassed because you did something wrong",wordClass:"adjective"},{word:"recovering",meaning:"getting back to normal after a shock",wordClass:"verb"},{word:"vowed",meaning:"promised seriously",wordClass:"verb"},{word:"suffered",meaning:"experienced pain or difficulty",wordClass:"verb"},{word:"passionately",meaning:"with very strong feeling",wordClass:"adverb"},{word:"resigned",meaning:"accepting something you cannot change",wordClass:"adjective"},{word:"anticipation",meaning:"excited waiting for something",wordClass:"noun"},{word:"fussed",meaning:"worried and paid too much attention to small things",wordClass:"verb"},{word:"urgently",meaning:"in a way that shows something must be said now",wordClass:"adverb"}],pre:[{id:"l13-pre-1",focus:"Prediction",title:"The Last Line",prompt:"Before reading, write the LAST sentence you think the novel will have. Seal it (fold the page!) and open it after reading.",minutes:4},{id:"l13-pre-2",focus:"Discussion",title:"Fight or Accept?",prompt:"When something is unfair, should you accept it to keep the peace, or fight it? Write four sentences with an example.",minutes:6}],whilst:[{id:"l13-while-1",focus:"Comprehension",title:"Final Whistle Questions",prompt:`(1) What does Tony announce, and what is his "one condition"? (2) Why does Jess tell the truth instead? (3) What finally persuades Dad? (4) What does Mum say at the end of the argument? (5) Why does Jess say no to Joe on the pitch? (6) What is Joe's news at the airport? (7) Who do Jess and Jules spot at Heathrow?`,minutes:15},{id:"l13-while-2",focus:"Language",title:"Dad's Speech",prompt:`Analyse Dad's speech. Look at the rhetorical question ("And who suffered? Me."), the repetition of "I want her to…", and the short sentences. How does it reverse what he said in Chapter Seven?`,quote:{text:"I want her to fight, and I want her to win.",ref:"Ch. 13, p. 161"},support:'In Chapter Seven Dad feared… but now… · The repetition of "I want her to" emphasises…',minutes:15},{id:"l13-while-3",focus:"Theme",title:"Full Circle",prompt:"Compare the opening and the ending: a TV fantasy in a bedroom → a real departure lounge; a Beckham poster → the real Beckhams passing by; Mum vs Mrs Paxton → Mum handing Mrs Paxton a tissue. Write three sentences: What has changed?",quote:{text:"Smiling, we turned and walked through the sliding doors. Into our future.",ref:"Ch. 13, p. 167"},minutes:12}],post:[{id:"l13-post-1",focus:"Creative",title:"Letter Home from Santa Clara",prompt:"Write Jess's first letter home after a month in California (200 words). Address it to Mum and Dad. Include football, food, homesickness, and one thing she now understands about her family.",minutes:15},{id:"l13-post-2",focus:"Theme",title:"Complete Your Theme Tracker",prompt:"Add final evidence to every box. Then circle the ONE theme you now think is most important in the novel and explain your choice in five sentences.",minutes:10}],sprinter:{id:"l13-sprint",focus:"Discussion",title:"⚡ Compromise or Rebellion?",prompt:`Essay (300 words): "Bend It Like Beckham is a story about compromise, not rebellion." To what extent do you agree? Consider Jess's choice about Joe on the pitch, Dad's speech, Tony's fake engagement and the airport ending.`,support:"Introduction: answer the question. · Paragraph 1: rebellion. · Paragraph 2: compromise. · Conclusion: your verdict.",minutes:30},game:{kind:"sort",title:"Theme Sorter: The Whole Novel",bins:["Family & Tradition","Prejudice","Dreams & Freedom","Friendship"],items:[{text:"Mum wants Jess to learn a full Punjabi dinner",bin:0},{text:"English cricket clubs laughed at Dad's turban",bin:1},{text:"Jules wants to play professionally in America",bin:2},{text:"Tony fakes an engagement to help Jess",bin:3},{text:"An opponent uses a racist insult in the semi-final",bin:1},{text:"The scholarship to Santa Clara",bin:2},{text:"Jules washes Jess's kit to keep her secret",bin:3},{text:"Jess must go to Kingston to become a solicitor",bin:0},{text:"Jess feels liberated in Hamburg",bin:2},{text:'Mrs Paxton asks "Is that Indian?"',bin:1},{text:"The doli: Pinky leaves her family's home",bin:0},{text:"Mel welcomes Jess on her first day",bin:3}]},unlocksCards:[]},{id:14,chapter:"Finale",title:"Full Time",tagline:"Thirteen chapters. Four weeks. One season.",pages:"Whole novel",week:4,setting:"The trophy room",accent:"lime",themes:["identity","family","gender","prejudice","friendship","secrets","dreams"],commentator:["FULL TIME! What a season, rookie.","One last Boss Match: questions from the whole novel.","Win it, then collect your Season Report."],stats:{passion:100,family:90,freedom:100,friendship:95},vocab:[{word:"protagonist",meaning:"the main character of a story",wordClass:"noun"},{word:"narrator",meaning:"the voice that tells the story",wordClass:"noun"},{word:"symbol",meaning:"an object that represents a bigger idea",wordClass:"noun"},{word:"metaphor",meaning:"describing something as if it were something else",wordClass:"noun"},{word:"foreshadowing",meaning:"a hint about what will happen later",wordClass:"noun"},{word:"irony",meaning:"when the opposite of what you expect happens",wordClass:"noun"},{word:"cliffhanger",meaning:"an exciting ending that leaves you in suspense",wordClass:"noun"},{word:"theme",meaning:"a big idea a text explores",wordClass:"noun"},{word:"stereotype",meaning:"a fixed, oversimplified idea about a group of people",wordClass:"noun"},{word:"novelisation",meaning:"a novel written from a film",wordClass:"noun"}],pre:[{id:"l14-pre-1",focus:"Theme",title:"Season Review Mind Map",prompt:"Draw a mind map with JESS in the middle. Add every character with one word about their relationship to her, and a quotation for at least four of them.",minutes:15}],whilst:[{id:"l14-while-1",focus:"Creative",title:"The Character Awards",prompt:"Host an awards night! Choose a winner for each category and write a two-sentence speech with evidence: Best Friend · Biggest Change · Funniest Moment · Bravest Decision · Most Misunderstood.",minutes:15},{id:"l14-while-2",focus:"Language",title:"Top Five Quotations",prompt:"Choose the five most important quotations in the novel. For each, write the reference, who says it, and one sentence on why it matters. Use your Theme Tracker.",minutes:15}],post:[{id:"l14-post-1",focus:"Creative",title:"Book Review",prompt:"Write a review (200 words) for a K07 reader: plot without spoilers, best character, best moment, who should read it, and a star rating out of five.",minutes:15},{id:"l14-post-2",focus:"Creative",title:"Sequel Pitch",prompt:'Pitch a sequel: Jess comes home at Christmas. What happens when she and Joe "tackle" her mum and dad? Write a blurb and a first paragraph.',minutes:15}],sprinter:{id:"l14-sprint",focus:"Language",title:"⚡ The Big Essay",prompt:"Essay (400 words): How does Narinder Dhami present the conflict between tradition and freedom in Bend It Like Beckham? Refer to at least three chapters, use quotations and comment on language, structure and context.",support:"Use your Theme Tracker, the source files and the quotations from each level.",minutes:40},game:{kind:"kick",title:"BOSS MATCH: The Whole Novel",questions:[{q:"Where does Dad work?",options:["HMV","Heathrow, as a security guard","A gurdwara","Avis"],answer:1,why:`He comes home "still in his security guard's uniform".`},{q:"How did Jess get her scar?",options:["A football tackle","Her trousers caught fire while making beans on toast","Falling off a bike","Hamburg"],answer:1,why:"She was eight, and Pinky put her in a cold bath."},{q:"What is Jess's cover story for training?",options:["Revision","A summer job at HMV","Visiting Biji","Driving lessons"],answer:1,why:"Jules suggests it in Chapter Three."},{q:"What sport did Dad play in Nairobi?",options:["Football","Hockey","Cricket","Rugby"],answer:2,why:"He was the best fast bowler in his school."},{q:"Why is the wedding first called off?",options:["Jess is seen with Jules at a bus stop","Pinky argues with Teetu","Mum is ill","The hall is booked"],answer:0,why:"Teetu's parents think Jules is an English boy."},{q:"What happens to Jess's penalty in Hamburg?",options:["Saved","Scores","Hits the crossbar","Hits the post and goes in"],answer:2,why:"It ricochets into the crowd."},{q:"Where does Tony tell Jess his secret?",options:["The temple","The bandstand","The airport","The minibus"],answer:1,why:"They are watching the boys play from the park bandstand."},{q:"What is Jess sent off for?",options:["Handball","Pushing an opponent who racially abused her","Swearing at the ref","Diving"],answer:1,why:"Jess asks whether shoving is worse than racist abuse."},{q:"What are Jess's A-level results?",options:["Three As","Two As and a B","Three Bs","An A, a B and a C"],answer:1,why:"Exactly what she needed, and she wishes she had failed."},{q:"What does Tony pretend in Chapter Thirteen?",options:["That he is ill","That he and Jess want to get engaged","That he is moving away","That he saw the final"],answer:1,why:"On the condition that Jess goes to college first."},{q:"What does Dad say he wants for Jess?",options:["To become a solicitor","To stay at home","To fight, and to win","To marry soon"],answer:2,why:'"I want her to fight, and I want her to win."'},{q:"Who do Jess and Jules see at Heathrow?",options:["Joe's dad","David and Victoria Beckham","Mia Hamm","Gary Lineker"],answer:1,why:`Jules screams: "It's got to be a sign…"`}]},unlocksCards:[]},{id:15,chapter:"Extra Time",title:"Women's Football Today",tagline:"From Jules's complaint in 2002 to sold-out Wembley.",pages:"Research unit",week:4,extra:!0,setting:"The library · the internet · your notebook",accent:"violet",themes:["gender","dreams","prejudice"],commentator:["Extra time! We're leaving 2002 and fast-forwarding to TODAY.","In Chapter Five, Jules said there was no money in the women's game in England. Was she right then? Is she still right now?","You are the journalist now. Research, check your sources, and bring the facts back to your notebook."],bookVoice:{text:"There's no money in the women's game over here.",ref:"Ch. 5, p. 55"},vocab:[{word:"professional",meaning:"paid to do something as your full-time job",wordClass:"adjective"},{word:"amateur",meaning:"doing something for enjoyment, not as a paid job",wordClass:"noun"},{word:"equality",meaning:"the same rights and chances for everyone",wordClass:"noun"},{word:"sponsorship",meaning:"money a company pays to be linked with a person or team",wordClass:"noun"},{word:"attendance",meaning:"the number of people who come to an event",wordClass:"noun"},{word:"salary",meaning:"a fixed amount of money paid for a job, usually every month",wordClass:"noun"},{word:"pay gap",meaning:"the difference between what two groups are paid",wordClass:"noun"},{word:"broadcast",meaning:"to show something on TV, radio or online",wordClass:"verb"},{word:"grassroots",meaning:"the everyday, local level of a sport (schools, clubs, parks)",wordClass:"noun"},{word:"campaign",meaning:"a planned effort to achieve a change",wordClass:"noun"}],pre:[{id:"l15-pre-1",focus:"Discussion",title:"Then: Jules in 2002",prompt:`Re-read the pub conversation in Chapter Five (pp. 55–56). List every complaint Jules makes about women's football in England (money, jobs, America, Mia Hamm…). Next to each one, predict: "changed" or "still true today"?`,quote:{text:"There's no money in the women's game over here.",ref:"Ch. 5, p. 55"},minutes:8},{id:"l15-pre-2",focus:"Culture",title:"Read the Briefing",prompt:`Open the source files "Women's Football Today" and "Research Like a Journalist". Copy the five-question source check into your notebook. You will use it in every research task.`,sourceId:"wftoday",minutes:10}],whilst:[{id:"l15-while-1",focus:"Culture",title:"Research Mission 1: Player Profile",prompt:"Choose ONE current women's footballer (a Lioness, a player from Germany, Switzerland, Hong Kong or anywhere else). Create a fact file: club, position, achievements, how she started playing, one obstacle she faced. Record TWO sources (website name + date you looked).",sourceId:"research",support:"Name: … · Club: … · Position: … · She started playing when… · One obstacle she faced was… · Sources: 1) … 2) …",sprinter:"Compare her start in football with Jess's. What is similar? What has changed since 2002?",minutes:25},{id:"l15-while-2",focus:"Theme",title:"Research Mission 2: Follow the Money",prompt:'Use the source file and your own research to make a "Then vs Now" table about MONEY: professional league, match fees for national teams, World Cup prize money, sponsorship. For each row, write the fact, the year and your source.',sourceId:"wftoday",support:"Row idea: World Cup prize money · Women 2023: … · Men 2022: … · Source: …",sprinter:"Maths link: what fraction of the men's prize money did the women's World Cup offer? Then explain THREE reasons why the gap might still exist (TV money, sponsorship, ticket sales, history).",minutes:25},{id:"l15-while-3",focus:"Language",title:"Source Detective",prompt:"Check three of the sources you used with the five questions: Who wrote it? When? Why? What evidence? Can I find it somewhere else? Give each source a trust score out of 5 and explain your score.",sourceId:"research",minutes:15}],post:[{id:"l15-post-1",focus:"Creative",title:"A Letter to Jules",prompt:"Write a letter to Jules in 2002 from today (200 words). Tell her what has changed in women's football, what has NOT changed yet, and what she would be most surprised by. Use at least three facts from your research.",support:"Dear Jules, you won't believe this, but… · Sadly, some things haven't changed: … · You would love…",minutes:15},{id:"l15-post-2",focus:"Discussion",title:"Debate Prep: Equal Pay?",prompt:'Prepare for a class debate: "Women footballers should be paid the same as men." Write three arguments FOR and three AGAINST, each with a piece of evidence. Then write your own opinion.',minutes:15}],sprinter:{id:"l15-sprint",focus:"Creative",title:"⚡ Equal Yet? Speech or Infographic",prompt:`Create EITHER a 300-word speech OR a hand-drawn infographic for your notebook with the title "Women's football: equal yet?". Use at least five statistics, cite every source, and end with a call to action.`,minutes:35},game:{kind:"timeline",title:"Timeline: 130 Years of Women's Football",events:["1895: First recorded women's match in England (British Ladies' Football Club)","1920: Dick, Kerr Ladies play at Goodison Park in front of 53,000 fans","1921: The FA bans women's teams from its members' grounds","1971: The ban is lifted after 50 years","1991: The first FIFA Women's World Cup is held in China","2002: Bend It Like Beckham (film and novel) comes out","2011: The FA Women's Super League (WSL) begins","2018: The WSL becomes fully professional","2020: England's women and men receive the same match fees","2022: The Lionesses win the Euros at Wembley","2025: England win the Euros again, in Switzerland"]},unlocksCards:[]}],Oo=n=>De.find(s=>s.id===n),ts=[{id:"jess",name:"Jess (Jesminder) Bhamra",role:"The Narrator · No. 7",colour:"#c8ff3d",initials:"JB",bio:"Has just finished her A-levels and lives in Hounslow. Talks to her Beckham poster, wears a Manchester United No. 7 shirt and hides a burn scar on her right thigh. Her parents want her to become a solicitor.",traits:{determination:95,tradition:55,humour:85,empathy:75},bigQuestion:"Is Jess a rebel, or is she trying to keep two worlds together?"},{id:"pinky",name:"Pinky Bhamra",role:"The Big Sister · Bride-to-be",colour:"#ff4d8d",initials:"PB",bio:"Jess's older sister, a rep on the Avis desk at Heathrow and 'the shopper from hell'. Engaged to Teetu after seeing him secretly for years.",traits:{determination:80,tradition:70,humour:70,empathy:50},bigQuestion:"Pinky also kept secrets. Why is her secret treated so differently from Jess's?"},{id:"tony",name:"Tony",role:"The Best Mate",colour:"#5cc8ff",initials:"T",bio:`Jess's friend for years. They revised for A-levels "in between football games". Loyal, kind, and keeping a secret of his own.`,traits:{determination:60,tradition:60,humour:70,empathy:95},bigQuestion:"What does Tony risk to help Jess, and what does that tell us about friendship?"},{id:"jules",name:"Jules (Juliette) Paxton",role:"The Striker · Hounslow Harriers",colour:"#ffb020",initials:"JP",bio:"Tall, short blonde hair, confident. She spots Jess in the park and invites her to a trial. She dreams of playing professionally in America.",traits:{determination:95,tradition:20,humour:80,empathy:60},bigQuestion:"Jules and Jess come from very different homes. In what ways are their problems the same?"},{id:"joe",name:"Joe",role:"The Coach",colour:"#a78bfa",initials:"J",bio:"Irish, with a 'soft Irish accent'. A knee injury ended his playing career, so he coaches the Harriers girls' side. He hasn't spoken to his father, who once pushed him too hard.",traits:{determination:85,tradition:30,humour:75,empathy:85},bigQuestion:"Joe tells Jess that parents do not always know best. Is he the right person to say it?"},{id:"mum",name:"Mrs Bhamra (Mum)",role:"The Guardian of Tradition",colour:"#ff7a59",initials:"MB",bio:'Loves Amitabh Bachchan films and has a "nose like a bloodhound". She wants Jess to learn to cook a full Punjabi dinner and worries about what the community will say.',traits:{determination:90,tradition:95,humour:65,empathy:55},bigQuestion:'Is Mum the "villain" of the novel, or does she simply love Jess in a different way?'},{id:"mel",name:"Mel",role:"The Captain",colour:"#34d399",initials:"M",bio:"Captain of the Harriers. Friendly, funny and protective. She welcomes Jess to the team on her first day and helps with the Hamburg makeover.",traits:{determination:85,tradition:35,humour:85,empathy:80},bigQuestion:`Mel calls Jess's family rules "a bit backward". Is that fair?`},{id:"mrspaxton",name:"Mrs Paxton",role:"Jules's Mum",colour:"#f472b6",initials:"MP",bio:'Works in a lingerie shop on Ealing Broadway, always glamorous, always trying to make Jules "more girly". She gets the wrong idea about Jess and Jules.',traits:{determination:70,tradition:80,humour:60,empathy:45},bigQuestion:"In what ways is Mrs Paxton a mirror image of Mrs Bhamra?"},{id:"teetu",name:"Teetu (Tejinder)",role:"Pinky's Fiancé",colour:"#fbbf24",initials:"TT",bio:'"Nice enough, but a bit of a wheeler dealer." His parents call off the wedding after a misunderstanding at a bus stop.',traits:{determination:50,tradition:70,humour:55,empathy:60},bigQuestion:"How much power do Teetu's parents have over his life?"},{id:"dad",name:"Mr Bhamra (Dad)",role:"The Former Fast Bowler",colour:"#60a5fa",initials:"DB",bio:"A security guard at Heathrow. As a teenager in Nairobi he was the best fast bowler in his school. In England, cricket clubs laughed at his turban and turned him away.",traits:{determination:70,tradition:75,humour:60,empathy:85},bigQuestion:"How does Dad's past explain the way he treats Jess?"},{id:"mrpaxton",name:"Mr Paxton",role:"Jules's Dad",colour:"#94a3b8",initials:"P",bio:"Close to Jules. He always stands up for her when her mum complains about football, and he comes to watch the semi-final.",traits:{determination:60,tradition:40,humour:70,empathy:85},bigQuestion:"Why might the author give Jules one parent who supports her and one who does not?"},{id:"biji",name:"Biji",role:"The Grandmother from Nairobi",colour:"#fb923c",initials:"B",bio:"Arrives from Nairobi for the wedding wearing bright red lipstick and gold jewellery, and dances with the candle-covered jaggo on her head.",traits:{determination:65,tradition:90,humour:95,empathy:60},bigQuestion:"What does Biji add to the comedy of the wedding chapters?"},{id:"scout",name:"The American Scout",role:"Santa Clara · Talent Spotter",colour:"#22d3ee",initials:"US",bio:"A short, stocky man in a baseball cap. He watched the Harriers in Germany and at the final, and recommends Jess and Jules for scholarships.",traits:{determination:70,tradition:10,humour:50,empathy:60},bigQuestion:"The scout appears for one page. Why is he still one of the most important characters?"}],Lb=n=>ts.find(s=>s.id===n),Bo=[{id:"novel",title:"From Film to Novel",kicker:"About the book",icon:"🎬",paragraphs:["Bend It Like Beckham began as a film directed by Gurinder Chadha in 2002. The screenplay was written by Gurinder Chadha, Guljit Bindra and Paul Mayeda Berges.","Narinder Dhami turned the screenplay into this novel, also published in 2002. A novelisation has to turn camera shots, music and actors' faces into words. Dhami chose to tell the story in the first person, through Jess's own voice.","In her note at the end of the book, Dhami explains that she grew up in almost exactly the same kind of circumstances as Jess."],facts:["Film released: 2002","Novel: Hodder Children's Books, 2002","13 chapters","Narrator: Jess, first person"],inTheNovel:"The novel opens inside Jess's head: a TV football fantasy that Mum breaks into. A film can show this with pictures. The book has to do it with tense, typography (capitals) and a sudden interruption.",thinkAbout:"What can a novel do that a film cannot? Think about Jess's private thoughts."},{id:"southall",title:"Hounslow, Southall & Heathrow",kicker:"Setting",icon:"✈️",paragraphs:["Hounslow and Southall are neighbouring areas of West London, right next to Heathrow Airport. From the 1950s onwards many families from the Punjab region of India and Pakistan settled here, partly because of work at the airport and in local factories.",'Southall Broadway, where Pinky drags Jess shopping, is famous for its sari shops, jewellers, sweet shops and grocers. People sometimes call it "Little Punjab".',"Planes fly low over these streets all day. Heathrow is a place of work for many families, and also a symbol of departure and new beginnings."],facts:["Dad: security guard at Heathrow","Pinky: Avis car-rental desk at Heathrow","Mum once worked overtime at Heathrow"],inTheNovel:"The Bhamra family's working lives are tied to Heathrow, and the final scene of the novel takes place in its departure lounge.",thinkAbout:"Why might the author begin and end the story so close to an airport?"},{id:"sikhism",title:"Sikhism in the Bhamra Home",kicker:"Religion & culture",icon:"🪯",paragraphs:["Sikhism began in the Punjab in the 15th century with Guru Nanak, the first of ten Sikh Gurus. Sikhs believe in one God, in equality of all people, in honest work and in sharing with others.",'A Sikh place of worship is a gurdwara (Jess calls it "the temple"). Its holy book is the Guru Granth Sahib. Every gurdwara serves langar, a free shared meal for anyone who comes, whatever their religion.','Many Sikh men wear a turban as a sign of faith. "Sat Sri Akal" is a common Sikh greeting.'],facts:["Picture of Guru Nanak on the Bhamras' wall",'"Swear by Babaji": Dad makes Jess swear on Guru Nanak',"Langar: Jess asks her parents to bring her some"],inTheNovel:"The picture of Guru Nanak appears again and again. Mum prays in front of it, Dad makes Jess swear by it, and Jess feels guilty passing it when she sneaks out.",thinkAbout:"Track the picture of Guru Nanak through the novel. What does it come to represent for Jess?"},{id:"kenya",title:"From Punjab to Nairobi to London",kicker:"History",icon:"🌍",paragraphs:["Kenya was a British colony. From the 1890s the British brought thousands of workers from India to build the Uganda Railway, and many Indian families stayed and built businesses and communities in East Africa.","After Kenya became independent in 1963, many East African Asians felt pushed out by new rules about jobs and citizenship. Large numbers moved to Britain in the late 1960s, and in 1972 all Asians were expelled from neighbouring Uganda.","Arriving in Britain was not easy. Many newcomers faced racism in housing, jobs and clubs, even though they held British passports."],facts:["Kenya independence: 1963","Commonwealth Immigrants Act: 1968","Uganda expulsion: 1972"],inTheNovel:'Dad was the best fast bowler in his school in Nairobi, and his team won the East African cup. In England, cricket clubs "laughed at my turban and sent me packing" (Ch. 7, p. 77). Biji still lives in Nairobi.',thinkAbout:"How does knowing this history change the way you read Dad?"},{id:"wedding",title:"A Punjabi Sikh Wedding",kicker:"Traditions",icon:"💍",paragraphs:["A Punjabi wedding is a series of events over several days, full of food, music and family.","Before the wedding: an engagement party; the vatna (also called maiyan), when women rub turmeric paste on the bride's face and arms; and the jaggo, a night of singing and dancing with a brass pot of lit candles carried on the head.","On the day: the groom arrives (traditionally on a white horse); the ceremony, Anand Karaj, takes place in the gurdwara, where the couple walk four times around the Guru Granth Sahib (the four laavan). Then comes the reception, with bhangra music. At the doli, the bride leaves her family's home to join her husband's family. It is often an emotional, tearful moment."],facts:["Vatna · Jaggo · Anand Karaj · Laavan · Doli","Bhangra: Punjabi folk music and dance"],inTheNovel:"Chapters 11–12 show the vatna, the jaggo, Teetu on a white horse, the four walks around the holy book, the bhangra reception and the doli.",thinkAbout:"Why do you think the author places the most important football match on the same day as these ceremonies?"},{id:"womensfootball",title:"Women's Football: Banned, then Booming",kicker:"Sport history",icon:"⚽",paragraphs:["In the 1910s, women's football was hugely popular in England. Some matches drew crowds of over 50,000. In 1921 the Football Association banned women's teams from playing on its members' grounds. The ban lasted 50 years, until 1971.","Around 2002, when the novel is set, women players in England were amateurs who usually had other jobs. In the USA, a professional league (WUSA) had just started in 2001, and stars like Mia Hamm were famous.","Today things have changed: England's Lionesses won the European Championship in 2022, and the Women's Super League is professional."],facts:["FA ban: 1921–1971","WUSA (USA pro league): 2001–2003","Lionesses: Euro champions 2022"],inTheNovel:`Jules complains there is "no money in the women's game over here" (Ch. 5, p. 55) and says an England player drives a taxi to pay her way.`,thinkAbout:`Jules says: "It ain't just an Indian thing." What does she mean, and is she right?`},{id:"beckham",title:"Beckham, Bend & the Beautiful Game",kicker:"Football culture c. 2002",icon:"🎯",paragraphs:['David Beckham played for Manchester United and was captain of England, wearing the No. 7 shirt. He was famous for "bending" free kicks: striking the ball off-centre so that it spins and curves round the defensive wall.',`In October 2001 his last-minute free kick against Greece sent England to the World Cup. Jess compares Jules's goal in Hamburg to it. He and his wife Victoria ("Posh Spice") were called "Posh and Becks".`,"The opening fantasy uses real TV football voices: commentator John Motson and presenters Gary Lineker, Alan Hansen and John Barnes. Sven-Göran Eriksson was England manager. Missing a penalty for England had become a painful tradition (Gareth Southgate in 1996, David Batty in 1998)."],facts:['To "bend it" = curve the ball',"England v Greece, Oct 2001","No. 7 shirt"],inTheNovel:'In the final, Jess hits "the edge of the ball" with her inside right foot and it curves round the wall into the net (Ch. 12, p. 149).',thinkAbout:'The title is a metaphor. What else does Jess have to "bend" around, apart from a wall of defenders?'},{id:"racism",title:"Racism, Sport & Standing Up",kicker:"Context · handle with care",icon:"✊🏽",paragraphs:['Racist abuse has a long history in British sport. In the 1970s and 80s, Black and Asian players and fans often faced insults from crowds. The campaign "Kick It Out" was set up in 1993 to fight racism in football.',"Irish people living in Britain also faced prejudice in the 20th century, especially during the years of conflict in Northern Ireland.","Today, using a racist slur in a match can lead to a ban. Clubs and referees are trained to report abuse, but players say there is still a lot to do."],facts:["Kick It Out: founded 1993","Racist abuse can be a criminal offence in the UK"],inTheNovel:`In the semi-final, an opponent fouls Jess and uses a racist slur. Jess pushes her and is sent off. Jess asks herself whether shoving someone is worse than racist abuse (Ch. 10, p. 121). Joe replies, "I'm Irish, Jess" (p. 123).`,thinkAbout:"Why can Joe understand Jess here, when he could not fully understand her family?"},{id:"twocultures",title:"Growing Up Between Two Cultures",kicker:"Identity",icon:"🪞",paragraphs:['Children of immigrants are sometimes called the "second generation". They often move between two sets of expectations: the language, food, religion and family rules at home, and the habits of school, friends and media outside.',"This can be exciting and creative, giving people two worlds to draw from. It can also cause conflict, when parents fear that their children are losing their culture, or when friends do not understand family rules.",'Narinder Dhami describes the novel as mirroring "the struggle many young Asians face, trying to live their lives caught between two cultures".'],inTheNovel:'Jess complains that "anything I want is just not Indian enough for them" (Ch. 3, p. 37), but she also defends her culture to the Harriers in the changing room (Ch. 4).',thinkAbout:"Does Jess have to choose one culture in the end? Look at the final chapter."},{id:"words",title:"Punjabi & Hindi Word Bank",kicker:"Language",icon:"🗣️",paragraphs:["Dhami mixes Punjabi and Hindi words into Jess's English, without translating most of them. This is called code-switching, and it makes the Bhamra family's voices feel real."],facts:["beti / putar: daughter / child (terms of affection)","-ji (Uncleji, Massiji): a sign of respect","Biji: grandmother","gora / gori / goreh: white man / white woman / white people","dhania: coriander · daal: lentils","aloo gobi: potato and cauliflower curry","chapatti: flat bread","shalwaar kameez: tunic and trousers","langar: free meal at the gurdwara","Chi chi!: an exclamation of disgust"],inTheNovel:`Mum's "Football shootball!" is an example of reduplication, a playful Punjabi way of saying "football and all that nonsense".`,thinkAbout:"Why might an author choose NOT to translate these words for the reader?"},{id:"lgbt",title:"Coming Out in 2002",kicker:"Context",icon:"🏳️‍🌈",paragraphs:['In 2002, attitudes to gay people in Britain were changing, but slowly. A law called Section 28 (1988–2003 in England) stopped schools from "promoting" homosexuality, so many young people grew up without hearing it talked about at all.',"Today, same-sex marriage has been legal in England since 2014, and the Equality Act 2010 protects people from discrimination."],facts:["Section 28: 1988–2003 (England)","Same-sex marriage in England: 2014"],inTheNovel:`Tony comes out to Jess in the bandstand (Ch. 10). Jess thinks that in her community "everyone pretended they just didn't exist" (p. 111), and realises she is not the only one who wants a different life from the one expected.`,thinkAbout:"How do Jess and Tony help each other in the novel?"},{id:"scholarship",title:"Scholarships & Santa Clara",kicker:"Dreams",icon:"🎓",paragraphs:[`In the USA, universities compete for top athletes and offer sports scholarships that pay for tuition. Women's college football ("soccer") grew enormously after a 1972 law, Title IX, required equal opportunities for women in school and college sport.`,"Santa Clara University is in California, a long way from Canada, despite what Mum hopes!"],facts:["Title IX: 1972","Santa Clara: California, USA"],inTheNovel:"The scout offers Jess and Jules scholarships to Santa Clara (Ch. 12). Jules has a place at Loughborough; Jess is expected to go to Kingston University to become a solicitor.",thinkAbout:"Why is America important in the novel? What does it represent for Jess and Jules?"},{id:"wftoday",title:"Women's Football Today",kicker:"Extra Time · background",icon:"🏟️",paragraphs:["When the novel came out in 2002, women's football in England was mostly amateur. Players trained in the evenings and paid their own way, just as Jules complains. Since then, the game has changed enormously.","Going professional: the FA Women's Super League (WSL) started in 2011 and became fully professional in 2018. Top players now train full-time. Many players in lower leagues and in other countries are still part-time and have second jobs.","Pay: in 2020 the FA announced that England's women and men would receive the same match fees for playing for their country. In 2022 the US women's national team won an equal-pay agreement with US Soccer after a long legal fight. But the gap at the top is still huge: FIFA's total prize money for the 2023 Women's World Cup was 110 million US dollars, compared with 440 million for the men's World Cup in 2022. Club salaries for most women players are also far lower than for men.","Crowds and success: 87,192 fans watched England's Lionesses beat Germany in the Euro 2022 final at Wembley. In 2022, more than 91,000 people watched a women's match at Barcelona's Camp Nou. England reached the 2023 World Cup final (losing 1–0 to Spain) and won the Euros again in 2025 in Switzerland.","Still to do: equal access to football for girls at school and in clubs, more TV coverage and sponsorship, better facilities, and safe, respectful environments for players."],facts:["WSL founded 2011 · fully professional 2018","England equal match fees: 2020","US women equal-pay deal: 2022","Prize money: women 2023 $110m · men 2022 $440m","Euro 2022 final: 87,192 at Wembley","Euro 2025: England champions again"],inTheNovel:`Jules says there is "no money in the women's game over here" and that an England player drives a taxi to pay her way (Ch. 5). Jess and Jules have to go to America to play professionally (Ch. 12).`,thinkAbout:"Figures change fast. These were correct in 2025. Check the date on everything you find, and update this table in your notebook with the newest facts you can find."},{id:"research",title:"Research Like a Journalist",kicker:"Skills · source checking",icon:"🔎",paragraphs:["Good researchers do not believe the first thing they read. Before you use a fact, ask these five questions:","1. WHO wrote it? (An expert, a news organisation, a club, a fan, an advert?) 2. WHEN was it written? (Is the number still up to date?) 3. WHY was it written? (To inform, to sell, to persuade?) 4. What EVIDENCE does it give? (Numbers, quotes, links?) 5. Can I find the same fact SOMEWHERE ELSE?","Useful starting points: BBC Sport, The FA (thefa.com), FIFA (fifa.com), UEFA (uefa.com), national football associations (e.g. the Hong Kong Football Association, the German DFB, the Swiss SFV), and your school library.","Write facts in your own words, record the website name and the date you looked, and never copy whole paragraphs. If something seems surprising or upsetting, check with your teacher."],facts:["Who? · When? · Why? · Evidence? · Elsewhere?","Always note: website + date","Own words, not copy-paste"],inTheNovel:"Jess only learns that women can play professionally because Jules tells her (Ch. 2) and shows her a video (Ch. 6). Information changes what people believe is possible.",thinkAbout:"Why do you think Jess had never heard of the Hounslow Harriers girls' side or the American pro league?"}],Ib=n=>Bo.find(s=>s.id===n),Eg=n=>[...n.pre.map(s=>s.id),`l${n.id}-vocab`,...n.whilst.map(s=>s.id),...n.post.map(s=>s.id),n.sprinter.id],ic=n=>Eg(n).filter(s=>s!==n.sprinter.id),Ag=(n,s)=>ic(n).filter(i=>s.doneTasks[i]).length;function $r(n,s){const i=Eg(n),o=i.filter(d=>s.doneTasks[d]).length,u=(s.gameStars[n.id]??0)>0,f=i.length+1;return{done:o+(u?1:0),total:f,pct:(o+(u?1:0))/f,won:u,complete:u&&o>=i.length-1}}function Jo(n){let s=0;for(const i of Object.keys(n.doneTasks))i.endsWith("-vocab")?s+=Pr.vocab:i.endsWith("-sprint")?s+=Pr.sprinter:s+=Pr.task;for(const i of Object.values(n.gameStars))s+=i*Pr.gameStar;return s+=Object.keys(n.seenSources).length*Pr.source,s}const bo=[{xp:0,name:"Park Player"},{xp:150,name:"Trialist"},{xp:400,name:"Squad Player"},{xp:800,name:"First Team"},{xp:1300,name:"Captain"},{xp:1900,name:"Santa Clara Scholar"}];function Ho(n){let s=0;bo.forEach((u,f)=>{n>=u.xp&&(s=f)});const i=bo[s],o=bo[s+1];return{...i,index:s,next:o,toNext:o?(n-i.xp)/(o
