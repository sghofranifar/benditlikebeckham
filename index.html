ime at work",bin:0},{text:"Jess plays evening matches",bin:1},{text:"Jess is earning wages",bin:0},{text:"Jess is still skint",bin:1},{text:"Jess has given up football",bin:0},{text:"Jules washes Jess's dirty kit",bin:1},{text:"Jess's bag is hidden in the flower border",bin:1}]},unlocksCards:["mel"]},{id:5,chapter:"Chapter Five",title:"Boots & Secrets",tagline:"Wedding shoes... or Adidas Predators?",pages:"pp. 49–62",week:2,setting:"Home · Carnaby Street · a pub · training",accent:"violet",password:"chiswick",themes:["secrets","family","dreams","gender"],commentator:["Last chapter ended on a cliffhanger: will Pinky give Jess away?","Then a shopping trip with a twist. Two pairs of shoes are needed... but only one is for the wedding.","And watch Joe. Something is changing in the way Jess sees her coach."],bookVoice:{text:"'And is that what you really want to do?' she asked.",ref:"Ch. 5, p. 56"},stats:{passion:96,family:40,freedom:50,friendship:80},vocab:[{word:"pleadingly",meaning:"in a begging way, asking for help",wordClass:"adverb"},{word:"seamstress",meaning:"a woman whose job is sewing clothes",wordClass:"noun"},{word:"approvingly",meaning:"in a way that shows you think something is good",wordClass:"adverb"},{word:"fumbling",meaning:"handling something clumsily",wordClass:"verb"},{word:"furiously",meaning:"in a very angry way",wordClass:"adverb"},{word:"sternly",meaning:"in a strict, serious way",wordClass:"adverb"},{word:"sprained",meaning:"injured by twisting a joint, such as an ankle",wordClass:"verb"},{word:"determined",meaning:"having decided firmly to do something",wordClass:"adjective"},{word:"concerned",meaning:"worried about someone",wordClass:"adjective"},{word:"twinged",meaning:"gave a sudden, short pain",wordClass:"verb"}],pre:[{id:"l5-pre-1",focus:"Prediction",title:"Sister Decision",prompt:"Pinky has just walked in the door. Write three things she could do next, and the consequence of each for Jess. Which do you think she will choose?",minutes:6},{i ion, such as sentence length, ellipsis (…), and the sudden interruption. Explain the effect of each on the reader.",quote:{text:"I wanted to kiss him, and nothing was going to stop me…",ref:"Ch. 8, p. 92"},sprinter:"The ellipsis makes the reader wait. Rewrite the moment WITHOUT any ellipses or short sentences. What is lost?",minutes:15},{id:"l8-while-3",focus:"Theme",title:"Honest with Herself?",prompt:"Jess blames the wine. Is that honest? Why does Jules stay so angry? Write a paragraph using the quotation below.",quote:{text:"But deep down, I kept asking myself — would I have tried to kiss Joe even if I was stone-cold sober?",ref:"Ch. 8, p. 94"},minutes:10}],post:[{id:"l8-post-1",focus:"Creative",title:"Jules's Side of the Story",prompt:"Rewrite the club scene and the journey home from JULES'S point of view, in the first person: what she saw, what she felt, what she thought on the flight home.",minutes:15},{id:"l8-post-2",focus:"Theme",title:"Theme Tracker: Friendship",prompt:'Add evidence to "Friendship": the makeover (Jules and Mel helping) AND the break-up of the friendship. How can one evening contain both?',minutes:6}],sprinter:{id:"l8-sprint",focus:"Theme",title:"⚡ The Pressure to Look a Certain Way",prompt:`Pinky tells Jess to wear make-up (Ch. 5), Mrs Paxton wants Jules to wear "lacy numbers" (Ch. 6), and in Hamburg Jess "didn't even recognise" herself (Ch. 8). Write an analytical paragraph: How does the novel explore the pressure on girls to look a certain way?`,minutes:20},game:{kind:"memory",title:"Memory Match: Chapter Eight Words",pairs:[["makeover","a big change to how someone looks"],["minuscule","extremely small"],["conscious","aware of something"],["unsteadily","in a wobbly way"],["churning","turning over with nerves"],["refused","said no"],["awkwardness","uncomfortable feeling between people"],["regretted","felt sorry about"]]},unlocksCards:[]},{id:9,chapter:"Chapter Nine",title:"Torn in Two",tagline:"Three conversations. Three closed doors.",pag ing clean or pure",wordClass:"noun"},{word:"nauseous",meaning:"feeling as if you are going to be sick",wordClass:"adjective"},{word:"numbly",meaning:"without feeling anything, as if in shock",wordClass:"adverb"},{word:"feeble",meaning:"weak; not convincing",wordClass:"adjective"},{word:"tempting",meaning:"making you want to do or have something",wordClass:"adjective"},{word:"trapped",meaning:"unable to escape from a place or situation",wordClass:"adjective"}],pre:[{id:"l11-pre-1",focus:"Culture",title:"Inside a Punjabi Wedding",prompt:"Read the source file. In your notebook, list the wedding ceremonies in the order they happen, with one sentence about each.",sourceId:"wedding",minutes:10},{id:"l11-pre-2",focus:"Discussion",title:"Whose Day Is It?",prompt:"Pinky's wedding and Jess's final are on the same day. Whose day matters more? Write three sentences for each side.",minutes:6}],whilst:[{id:"l11-while-1",focus:"Comprehension",title:"Countdown to the 25th",prompt:"(1) Why have Teetu's parents come back? (2) Why is the 25th a problem? (3) Why do Jules and Jess argue? (4) What are Jess's A-level results? (5) Why does she take her posters down? (6) What does Joe tell Dad at the door?",minutes:15},{id:"l11-while-2",focus:"Language",title:"Irony & Imagery",prompt:"Why is it ironic that good exam results make Jess miserable? Explain the metaphor in the quotation. Then explain what taking down the Beckham posters could symbolise.",quote:{text:"I couldn't tell them that it felt like I'd signed my own death warrant.",ref:"Ch. 11, p. 134"},support:'It is ironic because… · The metaphor "death warrant" suggests… · The posters represent…',minutes:12},{id:"l11-while-3",focus:"Theme",title:"Warmth and Pressure",prompt:`Make a two-column table: "Family as warmth" and "Family as pressure". Find at least three examples for each in this chapter (e.g. Dad frying jalebis, the aunties' comments, the bhangra dancing, Biji's grandson).`,quote:{text:"You're lucky to have a family that cares so much about you.",ref:"Ch. 11, p. 139"},sourceId:"wedding",minutes:12}],post:[{id:"l11-post-1",focus:"Creative",title:"The Jaggo Through Biji's Eyes",prompt:"Describe the jaggo night from Biji's point of view. She has come from Nairobi, she is eighty-five, and she is having the time of her life. What does she notice about her granddaughter?",minutes:12},{id:"l11-post-2",focus:"Theme",title:"Theme Tracker: Belonging",prompt:'Add this to "Identity": the singing comes from the house "as if to remind me where I belonged" (p. 139). Does Jess belong there? Does she belong on the pitch? Can she belong in both?',minutes:6}],sprinter:{id:"l11-sprint",focus:"Language",title:"⚡ Beckham on the Washing Line",prompt:"Jess practises bending a ball around a washing line of brightly coloured shalwar kameez (pp. 134–135). Write an analytical paragraph: How does this image bring Jess's two worlds together? What might the author want us to notice?",minutes:20},game:{kind:"timeline",title:"Timeline: Chapter Eleven",events:["Dad drives Jess home in silence","Teetu's parents return and the wedding is on again","Dad books the hall for Sunday the 25th","Jules visits and they argue about the scout","Jess opens her results: two As and a B","Jess takes down her Beckham posters","The vatna ceremony begins in the garden","Biji arrives from Nairobi","Biji dances with the jaggo on her head","Joe tells Jess the scout is interested in her too"]},unlocksCards:["biji"]},{id:12,chapter:"Chapter Twelve",title:"Bend It",tagline:"Red and gold. A pink sari. A free kick.",pages:"pp. 141–155",week:4,setting:"The temple · the reception · the final v QPR · the doli",accent:"lime",password:"jaggo",themes:["family","dreams","friendship","identity"],commentator:["Wedding day. Red and gold. And a bride who isn't supposed to smile.","Two hours until kick-off, and Jess is sitting in a gurdwara in a pink sari.","This is the chapter the whole book has been building towards. Read the free kick twice."],bookVoice:{t ecret?",options:["The temple","The bandstand","The airport","The minibus"],answer:1,why:"They are watching the boys play from the park bandstand."},{q:"What is Jess sent off for?",options:["Handball","Pushing an opponent who racially abused her","Swearing at the ref","Diving"],answer:1,why:"Jess asks whether shoving is worse than racist abuse."},{q:"What are Jess's A-level results?",options:["Three As","Two As and a B","Three Bs","An A, a B and a C"],answer:1,why:"Exactly what she needed, and she wishes she had failed."},{q:"What does Tony pretend in Chapter Thirteen?",options:["That he is ill","That he and Jess want to get engaged","That he is moving away","That he saw the final"],answer:1,why:"On the condition that Jess goes to college first."},{q:"What does Dad say he wants for Jess?",options:["To become a solicitor","To stay at home","To fight, and to win","To marry soon"],answer:2,why:'"I want her to fight, and I want her to win."'},{q:"Who do Jess and Jules see at Heathrow?",options:["Joe's dad","David and Victoria Beckham","Mia Hamm","Gary Lineker"],answer:1,why:`Jules screams: "It's got to be a sign…"`}]},unlocksCards:[]}],Mo=n=>ut.find(s=>s.id===n),db="beckham7",Xn=[{id:"jess",name:"Jess (Jesminder) Bhamra",role:"The Narrator · No. 7",colour:"#c8ff3d",initials:"JB",bio:"Has just finished her A-levels and lives in Hounslow. Talks to her Beckham poster, wears a Manchester United No. 7 shirt and hides a burn scar on her right thigh. Her parents want her to become a solicitor.",traits:{determination:95,tradition:55,humour:85,empathy:75},bigQuestion:"Is Jess a rebel, or is she trying to keep two worlds together?"},{id:"pinky",name:"Pinky Bhamra",role:"The Big Sister · Bride-to-be",colour:"#ff4d8d",initials:"PB",bio:"Jess's older sister, a rep on the Avis desk at Heathrow and 'the shopper from hell'. Engaged to Teetu after seeing him secretly for years.",traits:{determination:80,tradition:70,humour:70,empathy:50},bigQuestion:"Pinky also kept secrets. Why is her secret treated so differently from Jess's?"},{id:"tony",name:"Tony",role:"The Best Mate",colour:"#5cc8ff",initials:"T",bio:`Jess's friend for years. They revised for A-levels "in between football games". Loyal, kind, and keeping a secret of his own.`,traits:{determination:60,tradition:60,humour:70,empathy:95},bigQuestion:"What does Tony risk to help Jess, and what does that tell us about friendship?"},{id:"jules",name:"Jules (Juliette) Paxton",role:"The Striker · Hounslow Harriers",colour:"#ffb020",initials:"JP",bio:"Tall, short blonde hair, confident. She spots Jess in the park and invites her to a trial. She dreams of playing professionally in America.",traits:{determination:95,tradition:20,humour:80,empathy:60},bigQuestion:"Jules and Jess come from very different homes. In what ways are their problems the same?"},{id:"joe",name:"Joe",role:"The Coach",colour:"#a78bfa",initials:"J",bio:"Irish, with a 'soft Irish accent'. A knee injury ended his playing career, so he coaches the Harriers girls' side. He hasn't spoken to his father, who once pushed him too hard.",traits:{determination:85,tradition:30,humour:75,empathy:85},bigQuestion:"Joe tells Jess that parents do not always know best. Is he the right person to say it?"},{id:"mum",name:"Mrs Bhamra (Mum)",role:"The Guardian of Tradition",colour:"#ff7a59",initials:"MB",bio:'Loves Amitabh Bachchan films and has a "nose like a bloodhound". She wants Jess to learn to cook a full Punjabi dinner and worries about what the community will say.',traits:{determination:90,tradition:95,humour:65,empathy:55},bigQuestion:'Is Mum the "villain" of the novel, or does she simply love Jess in a different way?'},{id:"mel",name:"Mel",role:"The Captain",colour:"#34d399",initials:"M",bio:"Captain of the Harriers. Friendly, funny and protective. She welcomes Jess to the team on her first day and helps with the Hamburg makeover.",traits:{determination:85,tradition:35,humour:85,empathy:80},bigQuestion:`Mel calls Jess's family rules "a bit backward". Is that fair?`},{id:"mrspaxton",name:"Mrs Paxton",role:"Jules's Mum",colour:"#f472b6",initials:"MP",bio:'Works in a lingerie shop on Ealing Broadway, always glamorous, always trying to make Jules "more girly". She gets the wrong idea about Jess and Jules.',traits:{determination:70,tradition:80,humour:60,empathy:45},bigQuestion:"In what ways is Mrs Paxton a mirror image of Mrs Bhamra?"},{id:"teetu",name:"Teetu (Tejinder)",role:"Pinky's Fiancé",colour:"#fbbf24",initials:"TT",bio:'"Nice enough, but a bit of a wheeler dealer." His parents call off the wedding after a misunderstanding at a bus stop.',traits:{determination:50,tradition:70,humour:55,empathy:60},bigQuestion:"How much power do Teetu's parents have over his life?"},{id:"dad",name:"Mr Bhamra (Dad)",role:"The Former Fast Bowler",colour:"#60a5fa",initials:"DB",bio:"A security guard at Heathrow. As a teenager in Nairobi he was the best fast bowler in his school. In England, cricket clubs laughed at his turban and turned him away.",traits:{determination:70,tradition:75,humour:60,empathy:85},bigQuestion:"How does Dad's past explain the way he treats Jess?"},{id:"mrpaxton",name:"Mr Paxton",role:"Jules's Dad",colour:"#94a3b8",initials:"P",bio:"Close to Jules. He always stands up for her when her mum complains about football, and he comes to watch the semi-final.",traits:{determination:60,tradition:40,humour:70,empathy:85},bigQuestion:"Why might the author give Jules one parent who supports her and one who does not?"},{id:"biji",name:"Biji",role:"The Grandmother from Nairobi",colour:"#fb923c",initials:"B",bio:"Arrives from Nairobi for the wedding wearing bright red lipstick and gold jewellery, and dances with the candle-covered jaggo on her head.",traits:{determination:65,tradition:90,humour:95,empathy:60},bigQuestion:"What does Biji add to the comedy of the wedding chapters?"},{id:"scout",name:"The American Scout",role:"Santa Clara · Talent Spotter",colour:"#22d3ee",initials:"US",bio:"A short, stocky man in a baseball cap. He watched the Harriers in Germany and at the final, and recommends Jess and Jules for scholarships.",traits:{determination:70,tradition:10,humour:50,empathy:60},bigQuestion:"The scout appears for one page. Why is he still one of the most important characters?"}],hb=n=>Xn.find(s=>s.id===n),Lo=[{id:"novel",title:"From Film to Novel",kicker:"About the book",icon:"🎬",paragraphs:["Bend It Like Beckham began as a film directed by Gurinder Chadha in 2002. The screenplay was written by Gurinder Chadha, Guljit Bindra and Paul Mayeda Berges.","Narinder Dhami turned the screenplay into this novel, also published in 2002. A novelisation has to turn camera shots, music and actors' faces into words. Dhami chose to tell the story in the first person, through Jess's own voice.","In her note at the end of the book, Dhami explains that she grew up in almost exactly the same kind of circumstances as Jess."],facts:["Film released: 2002","Novel: Hodder Children's Books, 2002","13 chapters","Narrator: Jess, first person"],inTheNovel:"The novel opens inside Jess's head: a TV football fantasy that Mum breaks into. A film can show this with pictures. The book has to do it with tense, typography (capitals) and a sudden interruption.",thinkAbout:"What can a novel do that a film cannot? Think about Jess's private thoughts."},{id:"southall",title:"Hounslow, Southall & Heathrow",kicker:"Setting",icon:"✈️",paragraphs:["Hounslow and Southall are neighbouring areas of West London, right next to Heathrow Airport. From the 1950s onwards many families from the Punjab region of India and Pakistan settled here, partly because of work at the airport and in local factories.",'Southall Broadway, where Pinky drags Jess shopping, is famous for its sari shops, jewellers, sweet shops and grocers. People sometimes call it "Little Punjab".',"Planes fly low over these streets all day. Heathrow is a place of work for many families, and also a symbol of departure and new beginnings."],facts:["Dad: security guard at Heathrow","Pinky: Avis car-rental desk at Heathrow","Mum once worked overtime at Heathrow"],inTheNovel:"The Bhamra family's working lives are tied to Heathrow, and the final scene of the novel takes place in its departure lounge.",thinkAbout:"Why might the author begin and end the story so close to an airport?"},{id:"sikhism",title:"Sikhism in the Bhamra Home",kicker:"Religion & culture",icon:"🪯",paragraphs:["Sikhism began in the Punjab in the 15th century with Guru Nanak, the first of ten Sikh Gurus. Sikhs believe in one God, in equality of all people, in honest work and in sharing with others.",'A Sikh place of worship is a gurdwara (Jess calls it "the temple"). Its holy book is the Guru Granth Sahib. Every gurdwara serves langar, a free shared meal for anyone who comes, whatever their religion.','Many Sikh men wear a turban as a sign of faith. "Sat Sri Akal" is a common Sikh greeting.'],facts:["Picture of Guru Nanak on the Bhamras' wall",'"Swear by Babaji": Dad makes Jess swear on Guru Nanak',"Langar: Jess asks her parents to bring her some"],inTheNovel:"The picture of Guru Nanak appears again and again. Mum prays in front of it, Dad makes Jess swear by it, and Jess feels guilty passing it when she sneaks out.",thinkAbout:"Track the picture of Guru Nanak through the novel. What does it come to represent for Jess?"},{id:"kenya",title:"From Punjab to Nairobi to London",kicker:"History",icon:"🌍",paragraphs:["Kenya was a British colony. From the 1890s the British brought thousands of workers from India to build the Uganda Railway, and many Indian families stayed and built businesses and communities in East Africa.","After Kenya became independent in 1963, many East African Asians felt pushed out by new rules about jobs and citizenship. Large numbers moved to Britain in the late 1960s, and in 1972 all Asians were expelled from neighbouring Uganda.","Arriving in Britain was not easy. Many newcomers faced racism in housing, jobs and clubs, even though they held British passports."],facts:["Kenya independence: 1963","Commonwealth Immigrants Act: 1968","Uganda expulsion: 1972"],inTheNovel:'Dad was the best fast bowler in his school in Nairobi, and his team won the East African cup. In England, cricket clubs "laughed at my turban and sent me packing" (Ch. 7, p. 77). Biji still lives in Nairobi.',thinkAbout:"How does knowing this history change the way you read Dad?"},{id:"wedding",title:"A Punjabi Sikh Wedding",kicker:"Traditions",icon:"💍",paragraphs:["A Punjabi wedding is a series of events over several days, full of food, music and family.","Before the wedding: an engagement party; the vatna (also called maiyan), when women rub turmeric paste on the bride's face and arms; and the jaggo, a night of singing and dancing with a brass pot of lit candles carried on the head.","On the day: the groom arrives (traditionally on a white horse); the ceremony, Anand Karaj, takes place in the gurdwara, where the couple walk four times around the Guru Granth Sahib (the four laavan). Then comes the reception, with bhangra music. At the doli, the bride leaves her family's home to join her husband's family. It is often an emotional, tearful moment."],facts:["Vatna · Jaggo · Anand Karaj · Laavan · Doli","Bhangra: Punjabi folk music and dance"],inTheNovel:"Chapters 11–12 show the vatna, the jaggo, Teetu on a white horse, the four walks around the holy book, the bhangra reception and the doli.",thinkAbout:"Why do you think the author places the most important football match on the same day as these ceremonies?"},{id:"womensfootball",title:"Women's Football: Banned, then Booming",kicker:"Sport history",icon:"⚽",paragraphs:["In the 1910s, women's football was hugely popular in England. Some matches drew crowds of over 50,000. In 1921 the Football Association banned women's teams from playing on its members' grounds. The ban lasted 50 years, until 1971.","Around 2002, when the novel is set, women players in England were amateurs who usually had other jobs. In the USA, a professional league (WUSA) had just started in 2001, and stars like Mia Hamm were famous.","Today things have changed: England's Lionesses won the European Championship in 2022, and the Women's Super League is professional."],facts:["FA ban: 1921–1971","WUSA (USA pro league): 2001–2003","Lionesses: Euro champions 2022"],inTheNovel:`Jules complains there is "no money in the women's game over here" (Ch. 5, p. 55) and says an England player drives a taxi to pay her way.`,thinkAbout:`Jules says: "It ain't just an Indian thing." What does she mean, and is she right?`},{id:"beckham",title:"Beckham, Bend & the Beautiful Game",kicker:"Football culture c. 2002",icon:"🎯",paragraphs:['David Beckham played for Manchester United and was captain of England, wearing the No. 7 shirt. He was famous for "bending" free kicks: striking the ball off-centre so that it spins and curves round the defensive wall.',`In October 2001 his last-minute free kick against Greece sent England to the World Cup. Jess compares Jules's goal in Hamburg to it. He and his wife Victoria ("Posh Spice") were called "Posh and Becks".`,"The opening fantasy uses real TV football voices: commentator John Motson and presenters Gary Lineker, Alan Hansen and John Barnes. Sven-Göran Eriksson was England manager. Missing a penalty for England had become a painful tradition (Gareth Southgate in 1996, David Batty in 1998)."],facts:['To "bend it" = curve the ball',"England v Greece, Oct 2001","No. 7 shirt"],inTheNovel:'In the final, Jess hits "the edge of the ball" with her inside right foot and it curves round the wall into the net (Ch. 12, p. 149).',thinkAbout:'The title is a metaphor. What else does Jess have to "bend" around, apart from a wall of defenders?'},{id:"racism",title:"Racism, Sport & Standing Up",kicker:"Context · handle with care",icon:"✊🏽",paragraphs:['Racist abuse has a long history in British sport. In the 1970s and 80s, Black and Asian players and fans often faced insults from crowds. The campaign "Kick It Out" was set up in 1993 to fight racism in football.',"Irish people living in Britain also faced prejudice in the 20th century, especially during the years of conflict in Northern Ireland.","Today, using a racist slur in a match can lead to a ban. Clubs and referees are trained to report abuse, but players say there is still a lot to do."],facts:["Kick It Out: founded 1993","Racist abuse can be a criminal offence in the UK"],inTheNovel:`In the semi-final, an opponent fouls Jess and uses a racist slur. Jess pushes her and is sent off. Jess asks herself whether shoving someone is worse than racist abuse (Ch. 10, p. 121). Joe replies, "I'm Irish, Jess" (p. 123).`,thinkAbout:"Why can Joe understand Jess here, when he could not fully understand her family?"},{id:"twocultures",title:"Growing Up Between Two Cultures",kicker:"Identity",icon:"🪞",paragraphs:['Children of immigrants are sometimes called the "second generation". They often move between two sets of expectations: the language, food, religion and family rules at home, and the habits of school, friends and media outside.',"This can be exciting and creative, giving people two worlds to draw from. It can also cause conflict, when parents fear that their children are losing their culture, or when friends do not understand family rules.",'Narinder Dhami describes the novel as mirroring "the struggle many young Asians face, trying to live their lives caught between two cultures".'],inTheNovel:'Jess complains that "anything I want is just not Indian enough for them" (Ch. 3, p. 37), but she also defends her culture to the Harriers in the changing room (Ch. 4).',thinkAbout:"Does Jess have to choose one culture in the end? Look at the final chapter."},{id:"words",title:"Punjabi & Hindi Word Bank",kicker:"Language",icon:"🗣️",paragraphs:["Dhami mixes Punjabi and Hindi words into Jess's English, without translating most of them. This is called code-switching, and it makes the Bhamra family's voices feel real."],facts:["beti / putar: daughter / child (terms of affection)","-ji (Uncleji, Massiji): a sign of respect","Biji: grandmother","gora / gori / goreh: white man / white woman / white people","dhania: coriander · daal: lentils","aloo gobi: potato and cauliflower curry","chapatti: flat bread","shalwaar kameez: tunic and trousers","langar: free meal at the gurdwara","Chi chi!: an exclamation of disgust"],inTheNovel:`Mum's "Football shootball!" is an example of reduplication, a playful Punjabi way of saying "football and all that nonsense".`,thinkAbout:"Why might an author choose NOT to translate these words for the reader?"},{id:"lgbt",title:"Coming Out in 2002",kicker:"Context",icon:"🏳️‍🌈",paragraphs:['In 2002, attitudes to gay people in Britain were changing, but slowly. A law called Section 28 (1988–2003 in England) stopped schools from "promoting" homosexuality, so many young people grew up without hearing it talked about at all.',"Today, same-sex marriage has been legal in England since 2014, and the Equality Act 2010 protects people from discrimination."],facts:["Section 28: 1988–2003 (England)","Same-sex marriage in England: 2014"],inTheNovel:`Tony comes out to Jess in the bandstand (Ch. 10). Jess thinks that in her community "everyone pretended they just didn't exist" (p. 111), and realises she is not the only one who wants a different life from the one expected.`,thinkAbout:"How do Jess and Tony help each other in the novel?"},{id:"scholarship",title:"Scholarships & Santa Clara",kicker:"Dreams",icon:"🎓",paragraphs:[`In the USA, universities compete for top athletes and offer sports scholarships that pay for tuition. Women's college football ("soccer") grew enormously after a 1972 law, Title IX, required equal opportunities for women in school and college sport.`,"Santa Clara University is in California, a long way from Canada, despite what Mum hopes!"],facts:["Title IX: 1972","Santa Clara: California, USA"],inTheNovel:"The scout offers Jess
